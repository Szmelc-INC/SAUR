# Szmelc AUR (SAUR) configuration (sourced by bin/saur as bash).
# Precedence: built-in defaults < saur.conf < saur.local.conf (gitignored) < SAUR_* env vars.

SAUR_NAME=saur                      # stable repo: [saur] in pacman.conf, saur.db
SAUR_EX_SUFFIX=-ex                  # experimental repo [saur-ex], packages and commands foo -> foo-ex
SAUR_ORG=Szmelc-INC                 # GitHub org (or user) scanned for PKGBUILDs
SAUR_ARCH=x86_64
SAUR_URL=https://szmelc-inc.github.io/SAUR          # primary Server (+ /$arch)
SAUR_MIRRORS='https://github.com/Szmelc-INC/SAUR/releases/download/$arch'
SAUR_GH_REPO=Szmelc-INC/SAUR        # repo holding the release used as package storage

SAUR_INCLUDE_FORKS=0
SAUR_INCLUDE_ARCHIVED=0
SAUR_INCLUDE_PRIVATE=0              # 1 publishes private repos' packages to the world: think twice
SAUR_IGNORE_PATHS='(^|/)(tests?|testdata|examples?|vendor|node_modules|third_party)/'

SAUR_ALL_BRANCHES=1                 # 0: default branches only (no experimental builds from branches)
SAUR_IGNORE_BRANCHES='^(dependabot|renovate)/|^gh-pages$'   # extended regex, never built

SAUR_BUILD_TIMEOUT=3600             # seconds per PKGBUILD
SAUR_NOCHECK=0                      # 1 skips check()

SAUR_SIGN=auto                      # auto: sign when the secret key is at hand; 1: a missing key is fatal; 0: unsigned
SAUR_KEY=C69631CC012E144162746C4833AC2BAB31E9EB45   # signing key fingerprint, clients pin it (saur key gen / saur key)
SAUR_KEYFILE=keys/saur.asc          # its public half, committed; the secret half lives in gpg or $SAUR_GPG_KEY

SAUR_COLOR=#105c5c                  # site accent: Szmelc dirty cyan, stable tab (#rrggbb)
SAUR_EX_COLOR=#750f0f               # site accent on the experimental tab: dark red (#rrggbb)
SAUR_SILVER=#c0c0c0                 # second accent: silver, for secondary text and labels (#rrggbb)
SAUR_AQUA=#7fffd4                   # third accent, used sparingly: aquamarine "signed" badge (#rrggbb)
SAUR_HOMEPAGE=https://szmelc.com    # first link button on the site
